[package]
name = "thainlp-rs"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Porameht Khumsombat"]
description = "High-performance Thai NLP library - word segmentation, text normalization, and more"
repository = "https://github.com/porameht/thainlp-rs"
readme = "README.md"
keywords = ["thai", "tokenizer", "nlp", "word-segmentation"]
categories = ["text-processing", "internationalization"]
exclude = [".github", ".gitignore"]
include = ["src/**/*", "data/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "thainlp_rs"

[dependencies]
regex = "1"
anyhow = "1.0.45"
bytecount = "0.6.2"
regex-syntax = "0.6.25"
rayon = "1.5.1"
rustc-hash = "1.1.0"
binary-heap-plus = "0.4.1"
once_cell = "1.18.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bm25_benchmark"
harness = false
